<style>

:root{
  --card:var(--surface); --fg:var(--ink); --accent-fg:var(--accent-ink);
  --bg:#edeff4; --surface:#ffffff; --ink:#15171f; --sub:#5e6372; --line:#d9dce6;

  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --font-mono:var(--font-body);
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1118; --surface:#181b25; --ink:#eef0f7; --sub:#9aa1b5; --line:#2a2f3e;
    --accent:#eef0f7; --accent-ink:#15171f; --accent-soft:#2a2f3e; --ok:#4ade80; --danger:#f87171;
    --g-owarai:#f5a04a; --g-butai:#b79af0; --g-talk:#4cc9c9; --g-sports:#86d65a; --g-exhibit:#7aaaf5; --g-other:#9aa1b5; --g-music:#f0668f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1118; --surface:#181b25; --ink:#eef0f7; --sub:#9aa1b5; --line:#2a2f3e;
  --accent:#eef0f7; --accent-ink:#15171f; --accent-soft:#2a2f3e; --ok:#4ade80; --danger:#f87171;
    --g-owarai:#f5a04a; --g-butai:#b79af0; --g-talk:#4cc9c9; --g-sports:#86d65a; --g-exhibit:#7aaaf5; --g-other:#9aa1b5; --g-music:#f0668f;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
button,input,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}

.thumb{width:100%;border-radius:10px;margin-top:8px}
.bend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bend .btn{margin:0}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.bbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stub[data-g="舞台"]{--g:var(--g-butai)}

.stub .when .y{font-family:var(--font-mono);font-size:11px;color:var(--sub)}

.stub .when .w{font-size:12px;color:var(--sub)}
.stub .when .t{font-family:var(--font-mono);font-size:11px;color:var(--sub);margin-top:2px}
.stub .what{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.stub .who{font-weight:700;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.stub .ttl{font-size:14px;color:var(--sub);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.stub .where{font-size:13px;color:var(--ink);margin-top:2px}
.yhead{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:14px 2px 8px}
.yhead:first-child{margin-top:2px}
.empty{text-align:center;color:var(--sub);padding:44px 12px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.ticket .a{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.ticket .t{color:var(--sub);overflow-wrap:anywhere;margin-top:2px}
.ticket .m{font-family:var(--font-mono);font-size:14px;margin-top:10px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.field small{display:block;color:var(--sub);font-size:12px}
.field div{white-space:pre-wrap;overflow-wrap:anywhere}
.field.scroll div{max-height:calc(1.55em * 10);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lk{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}

.pfr img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;width:auto;height:auto;max-width:100%;max-height:100%;border-radius:12px;cursor:pointer}
.pdots{display:flex;justify-content:center;gap:6px;margin:8px 0 4px}
.pdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}

.plbx{position:fixed;inset:0;background:rgba(10,12,18,.88);display:grid;place-items:center;z-index:50;padding:16px}
.plbx img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.plbx span{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));color:#fff;font-size:13px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.thumbs:empty{display:none}
.sthumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.sthumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;padding:0 0 2px;cursor:pointer}
.scan .btn.dis{opacity:.45;pointer-events:none}
.scan{display:flex;gap:10px;margin-top:10px}
.scan .btn{margin-top:0}
.scan input{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:15px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.status{margin-top:10px;font-size:14px}
.alrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.alk{flex:none;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.aln{flex:1;min-width:0;overflow-wrap:anywhere}
.alx{flex:none;border:0;background:none;color:var(--danger);font-size:20px;cursor:pointer;padding:4px 8px}
.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stats .sc{flex:1;min-width:0;display:flex;flex-direction:column}
.stats .sc label{margin:0 0 4px}
.stats .card{flex:1;margin:0;text-align:center;display:flex;flex-direction:column;justify-content:center}
.stats b{display:block;font-family:var(--font-mono);font-size:22px;font-weight:500;color:var(--accent)}
.stats small{color:var(--sub)}
.donut{display:block;width:96px;height:96px;margin:0 auto 8px}
.donut circle{fill:none;stroke-width:5.5}
.gleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-2px 2px 14px;font-size:12px;color:var(--sub)}
.gleg span{display:inline-flex;align-items:center;gap:5px}
.gleg i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.seg{display:flex;gap:5px;margin:16px 0 8px}
.seg button{flex:1;padding:10px 0;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.h2{font-size:13px;color:var(--sub);font-weight:500;margin:18px 0 6px}
.line{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.line span{overflow-wrap:anywhere;min-width:0}

<body>
<div class="bar"><div class="bar-in"><h1>イベント参加記録</h1></div></div>
<main id="app"></main>
<button class="fab" id="fab" aria-label="イベントを追加"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
<div class="toast" id="toast" hidden></div>
<nav class="tabbar"><div class="tabbar-in">
  <button data-tab="list" class="on">一覧</button>
  <button data-tab="stats">集計</button>
  <button data-tab="settings">データ</button>
</div></nav>

<script>
"use strict";
/* ========== IndexedDB ========== */
const DB_NAME = "livelog", STORE = "lives";
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, {keyPath: "id"});
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
let dbp = openDB();
async function tx(mode, fn){
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const dbAll = () => tx("readonly", s => s.getAll());
const dbPut = v => tx("readwrite", s => s.put(v));
const dbDel = id => tx("readwrite", s => s.delete(id));
const dbClear = () => tx("readwrite", s => s.clear());

/* ========== ユーティリティ ========== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GENRES = ["音楽","舞台","お笑い","スポーツ","トーク","展示会","その他"];
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
const normPref = v => { const t = String(v || "").trim(); if(!t) return ""; return PREFS.find(x => x === t) || PREFS.find(x => x.replace(/[都道府県]$/, "") === t.replace(/[都道府県]$/, "")) || ""; };
const venueLabel = l => l.venue ? l.venue + (l.pref ? `(${l.pref})` : "") : (l.pref || "");
const genreOf = l => l && l.genre === "ライブ" ? "音楽" : l && l.genre === "演劇" ? "舞台" : GENRES.includes(l && l.genre) ? l.genre : "音楽";
/* ---------- 名寄せ(旧名 → 現在の名前) ---------- */
const ALIAS_LS = "livelog_alias_v1";
let aliases = {venue: {}, artist: {}};
const cleanAliasMap = m => { const o = {}; if(m && typeof m === "object" && !Array.isArray(m)) Object.keys(m).forEach(k => { const v = m[k], a = String(k).trim(); if(typeof v === "string" && a && v.trim() && a !== v.trim()) o[a] = v.trim(); }); return o; };

function toPhotoData(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try {
        const sc = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.max(1, Math.round(im.naturalWidth * sc)), h = Math.max(1, Math.round(im.naturalHeight * sc));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        let q = 0.74, d = c.toDataURL("image/jpeg", q);
        while(d.length > 150000 && q > 0.45){ q -= 0.08; d = c.toDataURL("image/jpeg", q); }
        /* 画質を下げても大きいときは、縮小して必ず150KB以内にする */
        for(let k = 0; d.length > 150000 && k < 6; k++){ c.width = Math.max(1, Math.round(c.width * 0.8)); c.height = Math.max(1, Math.round(c.height * 0.8)); const x2 = c.getContext("2d"); x2.fillStyle = "#fff"; x2.fillRect(0, 0, c.width, c.height); x2.drawImage(im, 0, 0, c.width, c.height); d = c.toDataURL("image/jpeg", 0.6); }
        URL.revokeObjectURL(url); res(d);
      } catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    im.src = url;
  });
}

async function shareOrDownload(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files: [file]})){
    try { await navigator.share({files: [file]}); return true; } catch(e){ if(e.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}

const isEmptyVal = v => v === "" || v == null || (Array.isArray(v) && !v.length);
function mergeFill(ex, o){
  const m = {...ex}; let ch = false;
  FIELDS.forEach(k => { if(k !== "genre" && isEmptyVal(ex[k]) && !isEmptyVal(o[k])){ m[k] = o[k]; ch = true; } });
  { const cur = artistsOf(ex), add = artistsOf(o).filter(n => !cur.includes(n)); if(add.length){ m.artists = cur.concat(add); ch = true; } } /* 出演者は、まだ入っていない名前だけを後ろに足す */
  if(o.artistRoles){
    const rr = {...(ex.artistRoles || {})}, names = artistsOf(m);
    Object.keys(o.artistRoles).forEach(n => { if(!rr[n] && names.includes(n)){ rr[n] = o.artistRoles[n]; ch = true; } });
    if(Object.keys(rr).length) m.artistRoles = rr;
  }
  if(!photoList(ex).length && photoList(o).length){ m.photos = photoList(o); ch = true; }

    const arr = Array.isArray(j) ? j : j && j.lives;

    if(j && !Array.isArray(j) && j.aliases && typeof j.aliases === "object"){ const ja = j.aliases; setAliases({venue: {...aliases.venue, ...cleanAliasMap(ja.venue)}, artist: {...aliases.artist, ...cleanAliasMap(ja.artist)}}); await saveAliases(); }

      <div class="m">${fmtDate(l.date)}${venueLabel(l) ? " ／ " + venueLinks(l) : ""}</div>
    </div>
    ${(() => { const a = artistsOf(l); return a.length > 10 ? `<div class="field scroll"><small>出演者</small><div tabindex="0">${a.map(n => lkBtn("artist", n)).join("\n")}</div></div>` : (a.length ? `<div class="field"><small>出演者</small><div>${a.map(n => lkBtn("artist", n)).join("\n")}</div></div>` : ""); })()}
    ${row(genreOf(l) === "スポーツ" ? "開場 ／ 開始" : "開場 ／ 開演", [l.open, l.start].filter(Boolean).map(fmtTime).join(" ／ "))}
    ${row("席種・券種", l.seatType)}
    ${row("座席・整理番号", l.seat)}
    ${row("チケット代", l.price !== "" && l.price != null ? yen(l.price) : "")}
    ${row("ジャンル", genreOf(l))}
    ${(() => { const t = String(l.setlist || "").trim(); return t ? `<div class="field"><small>詳細</small><div>${linkify(t)}</div></div>` : ""; })()}
    ${(() => { const g = tagsOf(l); return g.length ? `<div class="field"><small>タグ</small><div>${g.map(n => lkBtn("tag", n)).join("、")}</div></div>` : ""; })()}
    <div class="bbar"><div class="bbar-in" style="grid-template-columns:52px 1fr 1fr 52px"><button type="button" class="btn sec" id="prevEv" style="padding:0" aria-label="前のイベント"${nb.prev ? "" : " disabled"}>◀</button><button class="btn sec" id="back">戻る</button><button class="btn" id="edit">編集</button><button type="button" class="btn sec" id="nextEv" style="padding:0" aria-label="次のイベント"${nb.next ? "" : " disabled"}>▶</button></div></div>
  `;
  bindPhotoGallery(l);
  $("#prevEv").onclick = () => { if(nb.prev){ openDetail(nb.prev); slideIn("r"); } };
  $("#nextEv").onclick = () => { if(nb.next){ openDetail(nb.next); slideIn("l"); } };
  $("#back").onclick = () => setTab("list");
  $("#edit").onclick = () => openForm(l);
  document.querySelectorAll("#app .lk").forEach(b => b.onclick = () => { fGenre = ""; fYear = ""; exact = {kind: b.dataset.lk, value: b.dataset.lk === "pref" ? b.dataset.q : canon(b.dataset.lk, b.dataset.q)}; query = ""; setTab("list", {top: true}); });
}

/* ========== 入力フォーム ========== */
const splitArtists = s => String(s || "").split("、").map(x => x.trim()).filter(Boolean);
/* 並び順: 記号 → 数字 → 英字 → 日本語(読みの情報がないので、日本語は文字コード順) */
const sortNames = list => {
  const key = n => { const t = String(n).normalize("NFKC").replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).trim(), c = t.charAt(0);
    return [!/[\p{L}\p{N}]/u.test(c) ? 0 : /[0-9]/.test(c) ? 1 : /[A-Za-z]/.test(c) ? 2 : 3, t.toLowerCase()]; };
  return list.filter(Boolean).map(n => ({n, k: key(n)})).sort((a, b) => a.k[0] - b.k[0] || a.k[1].localeCompare(b.k[1], "ja")).map(o => o.n);
};
const kata2hira = s => String(s || "").replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
/* 登録済みの出演者名・会場名から、入力途中の文字(前方一致)に合う候補を出す */
function regCands(kind, typed, skipNames){
  const norm = x => kata2hira(String(x)).toLowerCase().replace(/\s+/g, "");
  const t = norm(typed);
  if(!t) return [];
  const m = new Map();
  lives.forEach(l => {
    const names = kind === "venue" ? (l.venue ? [l.venue] : []) : artistsOf(l);
    names.forEach(n0 => { const n = canon(kind, n0); const o = m.get(n) || {name: n, n: 0, pref: ""}; o.n++; if(kind === "venue" && l.pref) o.pref = l.pref; m.set(n, o); });
  });
  return [...m.values()].filter(o => o.name !== typed.trim() && !(skipNames || []).includes(o.name) && aliasNames(kind, o.name).some(x => norm(x).startsWith(t)))
    .sort((a, b) => b.n - a.n).slice(0, 6);
}
function showSugg(input, cands, onPick){
  document.querySelectorAll(".sugg").forEach(e => e.remove());
  if(!cands.length) return;
  const box = document.createElement("div");
  box.className = "sugg";
  box.innerHTML = cands.map((c, i) => `<button type="button" data-i="${i}">${esc(c.name)}${c.pref ? `<small>${esc(c.pref)}</small>` : ""}</button>`).join("");
  box.addEventListener("pointerdown", e => e.preventDefault());
  box.addEventListener("mousedown", e => e.preventDefault());
  box.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; e.preventDefault(); e.stopPropagation(); input.blur(); onPick(cands[Number(b.dataset.i)]); box.remove(); });
  (input.closest(".prow") || input.closest(".cw") || input).after(box);
}
const hideSugg = () => document.querySelectorAll(".sugg").forEach(e => e.remove());
const readArtists = () => [...document.querySelectorAll(".f_artist")].map(i => i.value.trim());
function artistRows(list){
  const arr = (list.length ? list : [""]).map(x => typeof x === "string" ? {name: x} : x);
  $("#artists").innerHTML = arr.map((a, i) => `<div class="prow"><div class="cw" style="flex:1;min-width:0"><input class="f_artist" id="f_artist_${i}" aria-label="出演者${i + 1}" value="${esc(a.name)}" placeholder=" "><button type="button" class="cx" data-clr="f_artist_${i}" aria-label="クリア">×</button></div>${arr.length > 1 ? `<button type="button" class="grip" aria-label="出演者${i + 1}を並べ替え(押したまま上下に動かす)">≡</button><button type="button" class="rm" aria-label="出演者${i + 1}を削除">×</button>` : ""}</div>`).join("");
  document.querySelectorAll("#artists .rm").forEach(b => b.onclick = () => { const cur = readArtists(); cur.splice([...document.querySelectorAll("#artists .rm")].indexOf(b), 1); artistRows(cur); });
  document.querySelectorAll("#artists .grip").forEach(g => {
    g.onpointerdown = ev => { if(ev.pointerType === "touch") return; ev.preventDefault(); dragArtist(ev, g, false); };
    g.addEventListener("touchstart", ev => { if(!ev.touches.length) return; ev.preventDefault(); dragArtist(ev.touches[0], g, true); }, {passive: false});
  });
}
/* ≡ を押したまま上下に動かして並べ替える(指でもマウスでも動く) */
function dragArtist(ev, grip, isTouch){
  const box = $("#artists"), row = grip.closest(".prow");
  const rows = [...box.querySelectorAll(".prow")], from = rows.indexOf(row);
  let sc = box.parentElement;
  while(sc && sc !== document.body && !(sc.scrollHeight > sc.clientHeight + 2 && /(auto|scroll)/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
  const useWin = !sc || sc === document.body;
  const getS = () => useWin ? (window.scrollY || document.documentElement.scrollTop || 0) : sc.scrollTop;
  const setS = d => { if(useWin) window.scrollBy(0, d); else sc.scrollTop += d; };
  const top = useWin ? 0 : sc.getBoundingClientRect().top, bot = useWin ? window.innerHeight : sc.getBoundingClientRect().bottom;
  /* 動かしている間は並べ替えず、見た目だけずらす。離したときにまとめて入れ替える(指を離すまで要素を動かさないので、iPhoneでも途切れない) */
  const s0 = getS(), y0 = ev.clientY;
  const mids = rows.map(r => { const b = r.getBoundingClientRect(); return b.top + b.height / 2 + s0; });
  const h = rows[from].getBoundingClientRect().height + 6;
  let curY = y0, to = from;
  row.classList.add("drag"); row.style.position = "relative"; row.style.zIndex = "5"; row.style.transition = "none";
  rows.forEach(r => { if(r !== row) r.style.transition = "transform .12s"; });
  if(!isTouch){ try { grip.setPointerCapture(ev.pointerId); } catch(e){} }
  const update = () => {
    const dy = curY - y0 + (getS() - s0);
    row.style.transform = `translateY(${dy}px)`;
    const c = mids[from] + dy;
    to = 0; rows.forEach((r, i) => { if(i !== from && mids[i] < c) to++; });
    rows.forEach((r, i) => { if(i === from) return; r.style.transform = (from < to && i > from && i <= to) ? `translateY(${-h}px)` : (from > to && i < from && i >= to) ? `translateY(${h}px)` : ""; });
  };
  const move = e => { if(isTouch){ e.preventDefault(); if(!e.touches.length) return; curY = e.touches[0].clientY; } else curY = e.clientY; update(); };
  const tick = setInterval(() => { const d = curY < top + 50 ? -12 : curY > bot - 50 ? 12 : 0; if(d){ setS(d); update(); } }, 30);
  const end = e => {
    clearInterval(tick);
    if(isTouch){ grip.removeEventListener("touchmove", move); grip.removeEventListener("touchend", end); grip.removeEventListener("touchcancel", end); }
    else { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", end); grip.removeEventListener("pointercancel", end); }
    const list = readArtists(); const [m] = list.splice(from, 1); list.splice(to, 0, m);
    artistRows(list);
  };
  if(isTouch){ grip.addEventListener("touchmove", move, {passive: false}); grip.addEventListener("touchend", end); grip.addEventListener("touchcancel", end); }
  else { grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", end); grip.addEventListener("pointercancel", end); }
}

function openForm(existing){
  saveScroll(); sub = true; subKind = "form"; subEdit = !!existing; subBack = () => existing ? openDetail(existing.id) : setTab("list");
  window.scrollTo(0, 0);
  const l = existing ? {...existing} : {id: uid(), createdAt: Date.now()};
  $("#fab").style.display = "none"; document.querySelector(".tabbar").hidden = true;
  const v = k => esc(l[k] ?? "");
  $("#app").innerHTML = `
    <div class="card" style="margin-top:12px">
      <label>公演名</label><div class="cw"><textarea id="f_title" placeholder=" " style="min-height:110px">${v("title")}</textarea><button type="button" class="cx" data-clr="f_title" aria-label="クリア">×</button></div>
      <label>出演者</label><div id="artists"></div>
      <button type="button" class="btn sec" id="addArtist" style="margin-top:8px">＋ 出演者を追加</button>
      <button type="button" class="btn sec" id="sortArtist">出演者を並べ替える</button>
      <div class="status" id="stSort"></div>
      <div class="lh"><label for="artIn">出演者をまとめて追加</label></div>
      <div class="cw"><textarea id="artIn" style="min-height:72px" placeholder="名前を「、」「,」や改行で区切って入力"></textarea><button type="button" class="cx" data-clr="artIn" aria-label="クリア">×</button></div>
      <button type="button" class="btn sec" id="artApply">入力欄に追加</button>
      <div class="status" id="stApply"></div>
      <div class="lh"><label>会場</label></div><div class="cw"><input id="f_venue" placeholder=" " value="${v("venue")}"><button type="button" class="cx" data-clr="f_venue" aria-label="クリア">×</button></div>
      <div class="lh"><label>会場(都道府県)</label></div><div class="cw"><select id="f_pref"><option value="">未選択</option>${PREFS.map(x => `<option value="${x}"${l.pref === x ? " selected" : ""}>${x}</option>`).join("")}</select></div>
      <div class="row3">
        <div><div class="lh"><label>日付</label></div><input id="f_date" type="date" value="${v("date")}"></div>
        <div><div class="lh"><label>開場</label></div><input id="f_open" type="time" value="${v("open")}"></div>
        <div><div class="lh"><label>開演</label></div><input id="f_start" type="time" value="${v("start")}"></div>
      </div>
      <div class="lh"><label>席種・券種</label></div><div class="cw"><input id="f_seatType" placeholder=" " value="${v("seatType")}"><button type="button" class="cx" data-clr="f_seatType" aria-label="クリア">×</button></div>
      <div class="lh"><label>座席・整理番号</label></div><div class="cw"><input id="f_seat" placeholder=" " value="${v("seat")}"><button type="button" class="cx" data-clr="f_seat" aria-label="クリア">×</button></div>
      <div class="lh"><label>チケット代</label></div><div class="cw"><input id="f_price" placeholder=" " type="number" inputmode="numeric" value="${v("price")}"><button type="button" class="cx" data-clr="f_price" aria-label="クリア">×</button></div>
      <label>ジャンル</label><select id="f_genre">${GENRES.map(g => `<option${genreOf(l) === g ? " selected" : ""}>${g}</option>`).join("")}</select>
      <div class="lh"><label>詳細</label></div><div class="cw"><textarea id="f_setlist" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="URLを入力(複数のときは改行で区切る)" style="min-height:96px">${v("setlist")}</textarea><button type="button" class="cx" data-clr="f_setlist" aria-label="クリア">×</button></div>
      <div class="lh"><label for="f_tags">タグ</label></div><div class="cw"><input id="f_tags" placeholder=" " autocomplete="off" value="${esc(tagsOf(l).join("、"))}"><button type="button" class="cx" data-clr="f_tags" aria-label="クリア">×</button></div>
      <div class="hint">ジャンルより細かい属性を、「、」で区切って複数入力できます(例: バンド、アイドル)</div>
    </div>
    ${photoCardHtml()}
    ${existing ? `<button class="btn danger" id="del">削除</button>` : ""}
    <div class="bbar"><div class="bbar-in"><button class="btn sec" id="cancel">キャンセル</button><button class="btn" id="save">${existing ? "保存" : "登録"}</button></div></div>
  `;
  artistRows(artistsOf(l));
  const fillPref = v => { const sel = $("#f_pref"); if(!sel || sel.value) return; const k = lives.find(z => z.venue === v && z.pref); if(k) sel.value = k.pref; };
  $("#f_venue").addEventListener("change", e => fillPref(e.target.value.trim()));
  $("#f_tags").addEventListener("input", e => { const el = e.target, v = el.value, i = Math.max(v.lastIndexOf("、"), v.lastIndexOf(","), v.lastIndexOf("，")), head = v.slice(0, i + 1); showSugg(el, tagCands(v.slice(i + 1), splitTags(head)), c => { el.value = head + c.name; }); });
  $("#f_venue").addEventListener("input", e => showSugg(e.target, regCands("venue", e.target.value), c => { e.target.value = c.name; if(c.pref){ const sel = $("#f_pref"); if(sel && !sel.value) sel.value = c.pref; } }));
  $("#f_venue").addEventListener("blur", () => setTimeout(hideSugg, 200));
  $("#artists").addEventListener("input", e => { const t = e.target; if(!t.classList.contains("f_artist")) return; showSugg(t, regCands("artist", t.value, readArtists().filter((n, i) => n && t !== document.querySelectorAll(".f_artist")[i])), c => { t.value = c.name; }); });
  $("#artists").addEventListener("focusout", () => setTimeout(hideSugg, 200));
  $("#sortArtist").onclick = () => {
    const cur = readArtists().filter(Boolean), sst = $("#stSort");
    if(cur.length < 2){ sst.className = "status err"; sst.textContent = "並べ替える出演者が2人以上必要です。"; return; }
    artistRows(sortNames(cur));
    sst.className = "status ok"; sst.textContent = "記号→数字→英字→日本語の順に並べ替えました。";
  };
  $("#artApply").onclick = () => {
    const sa = $("#stApply"), add = $("#artIn").value.split(/[、,，\n]/).map(x => x.trim()).filter(Boolean);
    if(!add.length){ sa.className = "status err"; sa.textContent = "出演者を入力してください。"; return; }
    const cur = readArtists().filter(Boolean);
    let cnt = 0;
    add.forEach(n => { if(!cur.includes(n)){ cur.push(n); cnt++; } });
    artistRows(cur);
    $("#artIn").value = "";
    sa.className = "status ok"; sa.textContent = `${cnt}件を入力欄に追加しました。保存すると反映されます。`;
  };
  $("#addArtist").onclick = () => { const cur = readArtists(); cur.push(""); artistRows(cur); const ins = document.querySelectorAll(".f_artist"); ins[ins.length - 1].focus(); };
  if(existing) $("#del").onclick = async () => {
    if(!confirm("このイベントを削除しますか?")) return;
    await dbDel(existing.id); await refresh(); setTab("list");
  };
  $("#cancel").onclick = () => { if(!confirm("入力中の内容は保存されません。戻りますか?")) return; existing ? openDetail(existing.id) : setTab("list"); };

  const getPhotos = setupPhotos(l);
  $("#save").onclick = async () => {
    FIELDS.forEach(k => { if(k !== "genre") l[k] = $("#f_" + k).value.trim(); });
    l.tags = splitTags(l.tags);
    l.genre = $("#f_genre").value || "音楽";
    l.title = l.title.replace(/\s*\n\s*/g, " ");
    l.artists = readArtists().filter(Boolean); delete l.artist;
    if(!l.artists.length && !l.title){ alert("公演名か出演者を入力してください"); return; }
    l.price = l.price === "" ? "" : Number(l.price);
    { const ph = getPhotos(); if(ph.length) l.photos = ph; else delete l.photos; }
    l.updatedAt = Date.now();
    await dbPut(l);
    await refresh();
    openDetail(l.id);
  };
}

/* ========== 起動 ========== */
(async () => {
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  await refresh();
  /* 保存済みの読み取り画像を一度だけすべて削除する */
  try {
    if(!localStorage.getItem("livelog_photo_purged_v1")){
      for(const x of lives){ if("photo" in x){ const y = {...x}; delete y.photo; await dbPut(y); } }
      localStorage.setItem("livelog_photo_purged_v1", "1");
      await refresh();
    }
  } catch(e){}
  setTab("list");
})();
</script>
</body>
</html>
